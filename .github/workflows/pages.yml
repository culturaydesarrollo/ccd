# Publica el sitio estatico (este repo) en la VM: rsync a /var/www/ccd-site,
# donde Caddy lo sirve en el apex con TLS. Sustituye al despliegue de
# GitHub Pages una vez apuntado el DNS a la VM (runbook ccd-infra, paso 10).
name: Deploy static site to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ccd-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "Faltan los secretos SSH_HOST y SSH_KEY (runbook ccd-infra, paso 10)." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            ./ "${SSH_USER:-root}@${SSH_HOST}:/var/www/ccd-site/"
          echo "Publicado en ${SSH_HOST} (/var/www/ccd-site)"
